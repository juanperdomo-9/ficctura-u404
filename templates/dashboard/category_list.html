{% extends "dashboard/base.html" %}
{% block title %}Categorías{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6 gap-3 flex-wrap">
    <h1 class="font-bold text-2xl">Categorías</h1>
    <a href="{% url 'dashboard:category_add' %}" class="dash-btn shrink-0">+ Nueva</a>
</div>

<div class="dash-card divide-y divide-white/10">
    {% for c in categories %}
    <div class="flex items-center justify-between gap-3 flex-wrap px-5 py-3.5">
        <a href="{% url 'dashboard:category_form' c.pk %}" class="hover:underline">{{ c.name }}{% if c.is_coming_soon %} <span class="text-xs text-white/40">(próximamente)</span>{% endif %}</a>
        <form method="post" action="{% url 'dashboard:category_delete' c.pk %}" onsubmit="return confirm('¿Eliminar esta categoría?');" class="shrink-0">
            {% csrf_token %}
            <button type="submit" class="text-xs text-red-400 hover:underline">Eliminar</button>
        </form>
    </div>
    {% empty %}
    <p class="px-5 py-4 text-sm text-white/40">Todavía no hay categorías.</p>
    {% endfor %}
</div>
{% endblock %}
