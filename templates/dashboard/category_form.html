{% extends "dashboard/base.html" %}
{% block title %}Categoría{% endblock %}
{% block content %}
<h1 class="font-bold text-2xl mb-6">{% if instance %}Editar{% else %}Nueva{% endif %} categoría</h1>

<form method="post" class="dash-card p-6 max-w-md space-y-4">
    {% csrf_token %}
    <div>
        <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Nombre</label>
        {{ form.name }}
    </div>
    <div>
        <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Marca</label>
        {{ form.brand }}
    </div>
    <div>
        <label class="block text-xs uppercase tracking-wide text-white/50 mb-1">Orden</label>
        {{ form.order }}
    </div>
    <label class="flex items-center gap-2 text-sm">
        {{ form.is_coming_soon }} Es "Próximamente" (sin productos reales todavía)
    </label>
    <div class="flex gap-3 pt-2">
        <button type="submit" class="dash-btn">Guardar</button>
        <a href="{% url 'dashboard:category_list' %}" class="dash-btn dash-btn--ghost">Cancelar</a>
    </div>
</form>
{% endblock %}
